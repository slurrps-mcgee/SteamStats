map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Steam CDN artwork is https on many hosts. Angular's ngsw intercepts those <img>
  # requests and re-fetches them in the worker, so connect-src must allow the same
  # https origins as img-src. script-src-attr hash is Angular's media=print onload
  # (`this.media='all'`), same as Snippy, in case a cached build still emits it.
  set $csp "default-src 'self'; script-src 'self'; script-src-attr 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; upgrade-insecure-requests";

  # Reverse proxy to the backend container. Do not add_header here — nginx would
  # drop the backend's Helmet headers, and this location must not inherit the
  # frontend CSP.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Never cache the service worker. Do not send the page CSP on this file:
  # the worker inherits CSP from its script, and connect-src 'self' would
  # block ngsw from fetching Steam CDN artwork.
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /ngsw.json {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Do not cache index.html so deploys drop the old media=print onload CSS link.
  # Repeat security headers here: nginx add_header does not inherit.
  location = /index.html {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;
  }

  # HTML/static: named location so try_files fallback to index.html keeps these
  # headers (an internal redirect to /index.html would not).
  location / {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    try_files $uri @spa;
  }

  location @spa {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;
    rewrite ^ /index.html break;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
