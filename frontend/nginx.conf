map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Steam CDN artwork (library cards, avatars, screenshots) is https on many hosts.
  # blob: covers future object URLs. Angular production CSS is a normal stylesheet
  # (inlineCritical is off) so script-src does not need the media=print onload hash.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; upgrade-insecure-requests";

  # Reverse proxy to the backend container. Do not add_header here — nginx would
  # drop the backend's Helmet headers, and this location must not inherit the
  # frontend CSP.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Never cache the service worker or its manifest.
  location = /ngsw-worker.js {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /ngsw.json {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Do not cache index.html so deploys drop the old media=print onload CSS link.
  # Repeat security headers here: nginx add_header does not inherit.
  location = /index.html {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;
  }

  # HTML/static: named location so try_files fallback to index.html keeps these
  # headers (an internal redirect to /index.html would not).
  location / {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    try_files $uri @spa;
  }

  location @spa {
    include /etc/nginx/nginx-security-headers.inc;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;
    rewrite ^ /index.html break;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
