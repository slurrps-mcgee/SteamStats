<footer class="w-full bg-steam-bg text-slate-400 backdrop-blur-md">
  <div class="mx-auto box-border w-full max-w-[1400px] px-4 py-3 md:px-8 md:py-3.5 xl:px-12">
    <div
      class="flex flex-wrap items-center justify-center gap-x-6 gap-y-3 text-center md:justify-between md:text-left"
    >
      <span class="text-sm">© 2026 Steam Stats</span>
      <nav class="flex flex-wrap items-center justify-center gap-x-4 gap-y-3 text-[0.8125rem]" aria-label="Legal and project links">
        <a class="ss-link" routerLink="/privacy">Privacy Policy</a>
        <a class="ss-link" routerLink="/terms">Terms</a>
        <a class="ss-link" [href]="licenseUrl" target="_blank" rel="noopener noreferrer">
          License <span class="sr-only">(opens in a new tab)</span>
        </a>
        <a class="ss-link" [href]="githubUrl" target="_blank" rel="noopener noreferrer">
          GitHub <span class="sr-only">(opens in a new tab)</span>
        </a>
      </nav>
    </div>
  </div>
</footer>
