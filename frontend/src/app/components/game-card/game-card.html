<a
  [routerLink]="['/game-details', game().appId]"
  class="group block overflow-hidden rounded-xl border border-white/5 bg-steam-card shadow-md transition-all hover:border-steam-primary/40 hover:shadow-xl focus:outline-none focus-visible:ring-2 focus-visible:ring-steam-primary/60"
>
  <div class="aspect-[460/215] overflow-hidden bg-steam-accent">
    @if (headerSrc()) {
      <img
        [src]="headerSrc()"
        [alt]="game().name"
        loading="lazy"
        class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105 motion-reduce:transition-none motion-reduce:group-hover:scale-100"
        (error)="onImageError($event)"
      />
    }
  </div>
  <div class="p-3">
    <div class="truncate text-sm font-medium text-white" [title]="game().name">
      {{ game().name }}
    </div>
    <div class="mt-1 text-xs text-steam-primary">
      {{ game().playtimeForeverMinutes | playtime }} played
    </div>
  </div>
</a>
