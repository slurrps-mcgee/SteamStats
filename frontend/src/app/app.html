<div class="flex h-screen flex-col overflow-hidden bg-steam-shell">
  <mat-toolbar class="z-10 shrink-0 bg-transparent text-white">
    <button mat-icon-button (click)="toggleNav()">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="w-full text-center text-2xl font-semibold">Steam Stats</span>
  </mat-toolbar>

  <mat-sidenav-container class="flex-1">
    <mat-sidenav
      #snav
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="!isMobile()"
      class="sidenav overflow-x-hidden rounded-none bg-steam-bg transition-[width] duration-300 ease-in-out"
      [style.width.px]="isMobile() ? 260 : expanded() ? 240 : 72"
    >
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive="active-link"
            [matTooltip]="!expanded() && !isMobile() ? item.label : ''"
            matTooltipPosition="right"
            (click)="closeMobile()"
            class="nav-item"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>

            <span
              matListItemTitle
              class="label"
              [class.collapsed]="!expanded() && !isMobile()"
            >
              {{ item.label }}
            </span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content
      class="content"
      [style.margin-left.px]="isMobile() ? 0 : expanded() ? 240 : 72"
    >
      <main class="page">
        <div class="page-inner mx-auto w-full max-w-[1400px] p-4 md:px-8 md:py-6 xl:px-12 xl:py-8">
          <router-outlet />
        </div>
      </main>
      <app-footer />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
