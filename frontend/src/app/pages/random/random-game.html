<div class="mx-auto flex max-w-lg flex-col items-center gap-6">
  <h1 class="w-full text-2xl font-semibold text-white">Random Game</h1>

  @if (!session.hasActiveProfile()) {
    <div class="ss-panel-muted w-full">
      Search for a Steam profile on the Dashboard first.
    </div>
  } @else if (loading()) {
    <app-loading-spinner label="Picking a game..." />
  } @else if (game(); as g) {
    <div class="w-full overflow-hidden rounded-2xl border border-white/5 bg-steam-card shadow-xl">
      @if (headerSrc()) {
        <img
          [src]="headerSrc()"
          [alt]="g.name"
          class="w-full object-cover"
          (error)="onImageError($event)"
        />
      }
      <div class="flex flex-col gap-2 p-6">
        <h2 class="text-xl font-semibold text-white">{{ g.name }}</h2>
        <p class="text-steam-primary">{{ g.playtimeForeverMinutes | playtime }} played</p>
      </div>
    </div>
    <button mat-flat-button color="primary" class="!h-12 !px-8" (click)="randomize()">
      <mat-icon class="mr-1" aria-hidden="true">casino</mat-icon>
      Randomize
    </button>
  } @else {
    <p class="text-slate-400">No games found in this library.</p>
  }
</div>
