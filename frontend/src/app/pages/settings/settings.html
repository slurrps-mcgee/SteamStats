<div class="flex max-w-lg flex-col gap-6">
  <h1 class="text-2xl font-semibold text-white">Settings</h1>

  <div class="ss-panel">
    <h2 class="mb-2 text-lg font-semibold text-white">Active Profile</h2>
    @if (session.hasActiveProfile()) {
      <p class="mb-4 text-sm text-slate-400">
        Currently viewing SteamID <span class="text-steam-primary">{{ session.steamId() }}</span>
      </p>
      <button mat-stroked-button color="warn" (click)="clearSession()">
        <mat-icon class="mr-1" aria-hidden="true">logout</mat-icon>
        Clear profile
      </button>
    } @else {
      <p class="text-sm text-slate-400">No profile is currently active.</p>
    }
  </div>

  <div class="ss-panel-muted p-6 text-left text-sm">
    Steam login, favorites, wishlist, and friends settings are coming in a future update.
  </div>
</div>
