name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run check:audit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck backend
        run: npm run typecheck --workspace=backend

      - name: Test backend
        run: npm run test:coverage --workspace=backend

      - name: Typecheck frontend
        run: npx tsc -p frontend/tsconfig.app.json --noEmit

      - name: Check OpenAPI artifacts are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- frontend/src/app/api/openapi.json frontend/src/app/api/generated/

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend (production)
        run: npm run build --workspace=frontend -- --configuration production
