# Local development only. Production images: docker-compose.prod.example.yml

services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.dev.sh"]
    command: ["npm", "run", "dev", "--workspace=backend"]
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - steamstats-net

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/.angular
    entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.dev.sh"]
    command:
      - npm
      - run
      - start
      - --workspace=frontend
      - --
      - --host
      - "0.0.0.0"
      - --poll
      - "1000"
      - --proxy-config
      - proxy.conf.json
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - steamstats-net

networks:
  steamstats-net:
    driver: bridge
