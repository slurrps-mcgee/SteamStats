# Production-like deployment example — multi-stage images, nginx on :8080.
# Use with: docker compose -f docker-compose.prod.example.yml up --build -d

services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    env_file:
      - ./.env
    expose:
      - "3000"
    # Intentionally no `ports:` mapping - the backend must only be reachable
    # from other containers on `steamstats-net` (via the frontend's nginx
    # reverse proxy), never directly from the host or the public internet.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - steamstats-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - steamstats-net
    restart: unless-stopped

networks:
  steamstats-net:
    driver: bridge
